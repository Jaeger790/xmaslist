# render.yaml
services:
  # Backend API
  - type: web
    name: xmaslist-api
    env: node
    buildCommand: npm install
    startCommand: node server.js

  # Frontend Static Site
  - type: web
    name: xmaslist
    env: static
    buildCommand: echo "No build needed"
    staticPublishPath: ./static
    routes:
      - type: rewrite
        source: /api/**
        destination: https://xmaslist-api.onrender.com/**
